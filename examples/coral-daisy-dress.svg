  <title id="sheet-title">Coral Daisy Flutter Dress</title>
  <desc id="sheet-description">Original coral baby dress concept, front on the left and back on the right. Matching round neckline and flutter sleeves, small cream floral print, two front patch pockets, and four cream buttons at the centre-back bodice opening. Editable vector illustration; not a cutting pattern or a validated size.</desc>
